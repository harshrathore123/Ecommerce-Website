# Port Number:
server.port=8080

# Spring App Name:
spring.application.name=api-gateway

# Eureka Client Service Connection:
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

#Creating the Configuration Gateway Routes:
    # For now Gateway and Eureka connected.
    # But Gateway don't know what incoming request we have to pass to which service

# 3.1 Route's Concept:
# For User-Service:

spring.cloud.gateway.server.webflux.routes[0].id=user-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**

# For Product-Service:

spring.cloud.gateway.server.webflux.routes[1].id=product-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/product/**

# For Order-Service:

spring.cloud.gateway.server.webflux.routes[2].id=order-service-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/order/**



